# Database per service: each gets its own Postgres cluster, so no service can
# reach another's data, and each can be sized, backed up and upgraded alone.
# CloudNativePG creates a Secret "<name>-db-app" with the connection URI.
databases:
  - catalog
  - order
  - notification

postgres:
  instances: 1 # 3 in a real production setup (1 primary + 2 replicas)
  storageSize: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  parameters:
    max_connections: "50"
    shared_buffers: "64MB"

redis:
  enabled: true
  image: redis:8-alpine
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 96Mi }

# Fake SMTP server with a web UI. A real environment would point the
# notification worker at a real provider instead.
mailpit:
  enabled: true
  image: axllent/mailpit:v1.31.4
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 128Mi }
