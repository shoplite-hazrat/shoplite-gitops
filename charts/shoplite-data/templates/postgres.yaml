{{- range .Values.databases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ . }}-db
  labels:
    {{- include "data.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
    shoplite.io/service: {{ . }}
spec:
  instances: {{ $.Values.postgres.instances }}
  storage:
    size: {{ $.Values.postgres.storageSize }}
  bootstrap:
    initdb:
      database: app
      owner: app
  postgresql:
    parameters:
      {{- toYaml $.Values.postgres.parameters | nindent 6 }}
  resources:
    {{- toYaml $.Values.postgres.resources | nindent 4 }}
{{- end }}
