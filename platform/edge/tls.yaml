# TLS for *.shoplite.localhost, issued by a local CA that cert-manager creates
# and keeps renewed:  selfsigned issuer -> "ShopLite Local CA" -> server cert.
# Browsers warn until you trust the CA (see README: "Trusting the local CA").
# On a real domain this is a Let's Encrypt ACME issuer instead.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shoplite-local-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  isCA: true
  commonName: ShopLite Local CA
  secretName: shoplite-local-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: shoplite-ca
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ca:
    secretName: shoplite-local-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shoplite-tls
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: shoplite-tls
  # 90 days, renewed automatically 30 days before expiry.
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - shoplite.localhost
    - "*.shoplite.localhost"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: shoplite-ca
    kind: ClusterIssuer
