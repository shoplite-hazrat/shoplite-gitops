# frontend: static SPA on nginx-unprivileged. No dependencies, so readiness = liveness.
fullnameOverride: frontend
image:
  repository: ghcr.io/shoplite-hazrat/frontend
containerPort: 8080
probes:
  readiness:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 3
resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { memory: 64Mi }
