# catalog-service: Node.js API. Postgres (CloudNativePG) + Redis cache.
fullnameOverride: catalog
image:
  repository: ghcr.io/shoplite-hazrat/catalog
containerPort: 3000
env:
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379
secretEnv:
  # Generated by CloudNativePG for the catalog-db cluster.
  DATABASE_URL: { secretName: catalog-db-app, key: uri }
migration:
  enabled: true
  args: ["src/migrate.js"]
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }
