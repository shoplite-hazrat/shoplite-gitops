# CloudNativePG: the operator that runs Postgres clusters on Kubernetes
# (provisioning, failover, backups, credentials). Installed before anything
# that declares a postgresql.cnpg.io/Cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1 # operator 1.30.1
    helm:
      releaseName: cnpg
      valuesObject:
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CNPG's CRDs exceed the size limit of client-side apply annotations.
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
